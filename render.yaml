services:
  - type: web
    name: machinegroup
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: machinegroup-db
          property: connectionString

databases:
  - name: machinegroup-db
    plan: free

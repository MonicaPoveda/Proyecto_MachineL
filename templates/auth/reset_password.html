{% extends "base.html" %}

{% block title %}Reset password | Application{% endblock %}

{% block content %}
<section class="hero pb-4">
    <div class="container">
        <p class="eyebrow mb-3">Application / Platform</p>
        <h1 class="mb-3">Reset password</h1>
    </div>
</section>

<section class="content-section pt-3">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-7 col-lg-5">
                <section class="info-card" aria-labelledby="reset-heading">
                    <h2 id="reset-heading" class="mb-3">New password</h2>
                    <form method="post" action="{{ url_for('auth.reset_password', token=token) }}">
                        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="password">New password</label>
                            <input class="form-control" id="password" name="password" type="password"
                                   autocomplete="new-password" minlength="8" required>
                            <div class="form-text text-light">At least 8 characters.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="confirm_password">Confirm new password</label>
                            <input class="form-control" id="confirm_password" name="confirm_password" type="password"
                                   autocomplete="new-password" minlength="8" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Save password</button>
                    </form>
                </section>
            </div>
        </div>
    </div>
</section>
{% endblock %}

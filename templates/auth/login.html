{% extends "base.html" %}

{% block title %}Sign in | Application{% endblock %}

{% block content %}
<section class="hero pb-4">
    <div class="container">
        <p class="eyebrow mb-3">Application / Platform</p>
        <h1 class="mb-3">Sign in</h1>
        <p class="research-intro mb-0">
            Sign in to use the URL analysis platform.
        </p>
    </div>
</section>

<section class="content-section pt-3">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-7 col-lg-5">
                <section class="info-card" aria-labelledby="login-heading">
                    <h2 id="login-heading" class="mb-3">Welcome back</h2>
                    <form method="post" action="{{ url_for('auth.login', next=next) }}">
                        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="email">Email</label>
                            <input class="form-control" id="email" name="email" type="email"
                                   autocomplete="username" placeholder="youremail@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="password">Password</label>
                            <input class="form-control" id="password" name="password" type="password"
                                   autocomplete="current-password" required>
                        </div>
                        <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
                            <a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a>
                            <a href="{{ url_for('auth.register') }}">Sign up</a>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Sign in</button>
                    </form>
                </section>
            </div>
        </div>
    </div>
</section>
{% endblock %}
